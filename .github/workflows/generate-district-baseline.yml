name: Generate district baseline

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/generate-district-baseline.yml'
      - 'scripts/generate_region1_district_hr_baseline.py'
      - 'API/amphur_population_store.py'

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install population parser dependencies
        run: pip install pandas requests lxml html5lib beautifulsoup4
      - name: Generate factual district baseline
        run: python scripts/generate_region1_district_hr_baseline.py
      - name: Commit refreshed static baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/hr_blueprint_district_baseline_region1.json
          if git diff --cached --quiet; then
            echo "District baseline unchanged"
            exit 0
          fi
          git commit -m "data: refresh Region 1 district baseline"
          git push
