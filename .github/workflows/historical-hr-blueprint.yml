name: Historical HR Blueprint regression

on:
  push:
    paths:
      - 'Simulator_HR_blueprint.html'
      - 'Simulator_HR_blueprint.js'
      - 'tests/historical_hr_blueprint.test.mjs'
      - '.github/workflows/historical-hr-blueprint.yml'
  pull_request:
    paths:
      - 'Simulator_HR_blueprint.html'
      - 'Simulator_HR_blueprint.js'
      - 'tests/historical_hr_blueprint.test.mjs'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test tests/historical_hr_blueprint.test.mjs
