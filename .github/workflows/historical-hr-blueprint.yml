name: Historical HR Blueprint regression

on:
  push:
    paths:
      - 'index.html'
      - 'Simulator_HR_blueprint.html'
      - 'Simulator_HR_blueprint.js'
      - 'Simulator_HR_blueprint_historical.js'
      - 'Simulator_HR_blueprint_district_status.js'
      - 'Simulator_HR_blueprint_profile.js'
      - 'Simulator_HR_blueprint_profile.css'
      - 'Simulator_HR_blueprint_dictionary.js'
      - 'Simulator_HR_blueprint_profession_dictionary.js'
      - 'Simulator_HR_blueprint_profession_workload.js'
      - 'Simulator_HR_blueprint_health_kpi.js'
      - 'Simulator_HR_blueprint_mock_chiangrai.js'
      - 'Simulator_HR_blueprint_v2_trace.js'
      - 'Simulator_HR_blueprint_formula_copy.js'
      - 'Simulator_HR_blueprint_excel_guide.js'
      - 'Simulator_HR_blueprint_help.js'
      - 'GOOGLE_SHEETS_PROFILE_GUIDE.md'
      - 'NCO_INDICATOR_STANDARD.md'
      - 'integrations/google_apps_script/Code.gs'
      - 'output/hr_blueprint_district_baseline_region1.json'
      - 'scripts/generate_region1_district_hr_baseline.py'
      - 'tests/*.test.mjs'
      - 'tests/test_generate_region1_district_hr_baseline.py'
      - '.github/workflows/historical-hr-blueprint.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'Simulator_HR_blueprint.html'
      - 'Simulator_HR_blueprint.js'
      - 'Simulator_HR_blueprint_historical.js'
      - 'Simulator_HR_blueprint_district_status.js'
      - 'Simulator_HR_blueprint_profile.js'
      - 'Simulator_HR_blueprint_profile.css'
      - 'Simulator_HR_blueprint_dictionary.js'
      - 'Simulator_HR_blueprint_profession_dictionary.js'
      - 'Simulator_HR_blueprint_profession_workload.js'
      - 'Simulator_HR_blueprint_health_kpi.js'
      - 'Simulator_HR_blueprint_mock_chiangrai.js'
      - 'Simulator_HR_blueprint_v2_trace.js'
      - 'Simulator_HR_blueprint_formula_copy.js'
      - 'Simulator_HR_blueprint_excel_guide.js'
      - 'Simulator_HR_blueprint_help.js'
      - 'GOOGLE_SHEETS_PROFILE_GUIDE.md'
      - 'NCO_INDICATOR_STANDARD.md'
      - 'integrations/google_apps_script/Code.gs'
      - 'output/hr_blueprint_district_baseline_region1.json'
      - 'scripts/generate_region1_district_hr_baseline.py'
      - 'tests/*.test.mjs'
      - 'tests/test_generate_region1_district_hr_baseline.py'
      - '.github/workflows/historical-hr-blueprint.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check Simulator_HR_blueprint_profile.js
      - run: node --check Simulator_HR_blueprint_dictionary.js
      - run: node --check Simulator_HR_blueprint_profession_dictionary.js
      - run: node --check Simulator_HR_blueprint_profession_workload.js
      - run: node --check Simulator_HR_blueprint_health_kpi.js
      - run: node --check Simulator_HR_blueprint_mock_chiangrai.js
      - run: node --check Simulator_HR_blueprint_v2_trace.js
      - run: node --check Simulator_HR_blueprint_formula_copy.js
      - run: node --check Simulator_HR_blueprint_excel_guide.js
      - run: node --check Simulator_HR_blueprint_help.js
      - run: node --test tests/*.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest tests.test_generate_region1_district_hr_baseline
